# ==============================================================================
# ERPfy.net Production Docker Compose Stack
# Architecture: Caddy Reverse Proxy -> ERPfy App + Workers -> Postgres + Redis
# ==============================================================================

name: erpfy

services:
  # 1. Reverse Proxy & Automatic On-Demand TLS
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - erpfy_network
    depends_on:
      - erpfy-app

  # 2. ERPfy Primary Web Application
  erpfy-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ERPFY_SECRET_KEY=${ERPFY_SECRET_KEY:-erpfy-production-master-secret-key-material}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-erpfy.net}
      - DATABASE_DRIVER=${DATABASE_DRIVER:-postgres}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-erpfy}:${POSTGRES_PASSWORD:-secure_erpfy_password}@postgres:5432/${POSTGRES_DB:-erpfy_prod}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_DRIVER=${JOB_QUEUE_DRIVER:-redis}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - erpfy_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 3. ERPfy Asynchronous Queue Worker Daemon
  erpfy-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "--import", "tsx", "scripts/queue-worker.ts"]
    restart: always
    environment:
      - NODE_ENV=production
      - ERPFY_SECRET_KEY=${ERPFY_SECRET_KEY:-erpfy-production-master-secret-key-material}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-erpfy.net}
      - DATABASE_DRIVER=${DATABASE_DRIVER:-postgres}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-erpfy}:${POSTGRES_PASSWORD:-secure_erpfy_password}@postgres:5432/${POSTGRES_DB:-erpfy_prod}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_DRIVER=${JOB_QUEUE_DRIVER:-redis}
    networks:
      - erpfy_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. PostgreSQL Production Database (Strictly internal network - no host port exposed)
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erpfy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_erpfy_password}
      POSTGRES_DB: ${POSTGRES_DB:-erpfy_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erpfy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erpfy} -d ${POSTGRES_DB:-erpfy_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Redis Queue, Cache & Rate Limiting (Strictly internal network - no host port exposed)
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - erpfy_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  erpfy_network:
    driver: bridge
